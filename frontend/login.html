<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Fraud Detection - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">

<div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-full mb-4">
            <i data-lucide="shield" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">ATM Fraud Detection</h1>
        <p class="text-gray-600 mt-2">Secure login to access the system</p>
    </div>

    <div id="loginForm">
        <form id="loginFormEl" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" id="loginBtn"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <i data-lucide="log-in" class="w-5 h-5 mr-2"></i>
                Sign In
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Don't have an account?
                <a href="#" id="showRegister" class="font-medium text-indigo-600 hover:text-indigo-500">Register here</a>
            </p>
        </div>
    </div>

    <div id="registerForm" class="hidden space-y-6">
        <form id="registerFormEl" class="space-y-6">
            <div>
                <label for="regUsername" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="regUsername" name="regUsername" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="regEmail" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="regEmail" name="regEmail" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="regPassword" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="regPassword" name="regPassword" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" id="registerBtn"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                <i data-lucide="user-plus" class="w-5 h-5 mr-2"></i>
                Register
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Already have an account?
                <a href="#" id="showLogin" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in here</a>
            </p>
        </div>
    </div>

    <div id="message" class="hidden mt-6 p-4 rounded-lg"></div>
</div>

<script>
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const showRegister = document.getElementById('showRegister');
const showLogin = document.getElementById('showLogin');
const messageDiv = document.getElementById('message');

showRegister.addEventListener('click', (e) => {
    e.preventDefault();
    loginForm.classList.add('hidden');
    registerForm.classList.remove('hidden');
});

showLogin.addEventListener('click', (e) => {
    e.preventDefault();
    registerForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
});

document.getElementById('loginFormEl').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Dummy login logic
    if (username && password) {
        localStorage.setItem('user', username);
        window.location.href = 'index.html';
    } else {
        showMessage('Please enter valid credentials', 'error');
    }
});

document.getElementById('registerFormEl').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('regUsername').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    // Dummy register logic
    if (username && email && password) {
        localStorage.setItem('user', username);
        showMessage('Registration successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'index.html', 2000);
    } else {
        showMessage('Please fill all fields', 'error');
    }
});

function showMessage(text, type) {
    messageDiv.className = `mt-6 p-4 rounded-lg ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`;
    messageDiv.textContent = text;
    messageDiv.classList.remove('hidden');
}

lucide.createIcons();
</script>

</body>
</html>
